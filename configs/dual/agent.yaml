seed: 42
device: cuda:0
num_steps_per_env: 48
max_iterations: 2
empirical_normalization: {}
obs_groups: {}
clip_actions: null
check_for_nan: true
save_interval: 25
experiment_name: fairino3_dual_centerline_v1
run_name: _playback_visual
logger: tensorboard
neptune_project: isaaclab
wandb_project: isaaclab
resume: false
load_run: .*
load_checkpoint: model_.*.pt
class_name: OnPolicyRunner
actor:
  class_name: fairino3_dual.tasks.manager_based.fairino3_dual_pingpong.models.DualArmActor
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 0.4
    std_type: scalar
critic:
  class_name: MLPModel
  hidden_dims:
  - 512
  - 256
  - 128
  activation: elu
  obs_normalization: false
  distribution_cfg: null
algorithm:
  class_name: PPO
  num_learning_epochs: 5
  num_mini_batches: 32
  learning_rate: 0.0003
  schedule: fixed
  gamma: 0.99
  lam: 0.95
  entropy_coef: 0.0015
  desired_kl: 0.01
  max_grad_norm: 1.0
  optimizer: adam
  value_loss_coef: 1.0
  use_clipped_value_loss: true
  clip_param: 0.2
  normalize_advantage_per_mini_batch: false
  share_cnn_encoders: false
  rnd_cfg: null
  symmetry_cfg: null
policy: {}
